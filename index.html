<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy Online Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="logo" href="#">ShopEasy</a>
    <nav><a href="#products">Products</a> <a href="#cart">Cart (<span id="cart-count">0</span>)</a></nav>
  </header>

  <main>
    <section class="hero">
      <h1>Find something you love</h1>
      <p>Everyday essentials at friendly prices.</p>
      <a class="shop-button" href="#products">Shop now</a>
    </section>

    <section id="products">
      <h2>Featured products</h2>
      <div id="product-list" class="products"></div>
    </section>

    <section id="cart" class="cart">
      <h2>Your cart</h2>
      <ul id="cart-items"></ul>
      <p class="total">Total: ₹<span id="cart-total">0</span></p>
      <button id="checkout">Place demo order</button>
      <p id="message" aria-live="polite"></p>
    </section>
  </main>

  <footer>ShopEasy · Demo store</footer>
</body>
</html>
